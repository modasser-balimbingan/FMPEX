services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ardnet-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ardnet
      RABBITMQ_DEFAULT_PASS: 151515
    volumes:
      - ardnet-rabbitmq-data:/var/lib/rabbitmq

volumes:
  ardnet-rabbitmq-data:
